<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyGenX | Ultra-Secure Password Generator</title>
    <meta name="description" content="Generate ultra-secure passwords instantly with KeyGenX. Professional cybersecurity-grade tool with local-only processing.">
    <!-- Google Fonts: Poppins for UI, JetBrains Mono for passwords -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="glow-bg">
        <div class="blob blob-purple"></div>
        <div class="blob blob-green"></div>
    </div>

    <div class="app-wrapper">
        <main class="vault-card">
            <header class="header">
                <div class="logo-area">
                    <div class="title-wrap">
                        <svg class="lock-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" style="color: var(--purple); margin-right: 10px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <h1 id="app-title">KeyGenX</h1>
                    </div>
                    <div class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Mode">
                        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="18.36" x2="5.64" y2="16.92"></line><line x1="18.36" y1="5.64" x2="19.78" y2="7.06"></line></svg>
                    </div>
                </div>
                <p class="subtitle">Generate ultra-secure passwords instantly</p>
            </header>

            <div class="display-section">
                <div class="password-box">
                    <div id="password-output" class="monospace">••••••••••••</div>
                    <div class="actions">
                        <button id="copy-btn" class="icon-btn" title="Copy Password">
                            <svg class="copy-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <svg class="check-icon hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span class="toast">Copied!</span>
                        </button>
                        <button id="regenerate-btn" class="icon-btn" title="Regenerate">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="strength-meter">
                    <div class="meter-track">
                        <div id="strength-bar" class="meter-fill"></div>
                    </div>
                    <span id="strength-text">Strength: --</span>
                </div>
            </div>

            <div class="config-section">
                <div class="control-group">
                    <div class="label-row">
                        <span>Password Length</span>
                        <span id="length-val" class="highlight">16</span>
                    </div>
                    <input type="range" id="length-slider" min="8" max="32" value="16" step="1">
                </div>

                <div class="toggles-grid">
                    <div class="toggle-item">
                        <span class="toggle-label">Uppercase (A-Z)</span>
                        <label class="switch">
                            <input type="checkbox" id="upper" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Lowercase (a-z)</span>
                        <label class="switch">
                            <input type="checkbox" id="lower" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Numbers (0-9)</span>
                        <label class="switch">
                            <input type="checkbox" id="numbers" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Symbols (!@#$)</span>
                        <label class="switch">
                            <input type="checkbox" id="symbols" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-item full-width">
                        <span class="toggle-label">Exclude Similar (i, l, 1, L, o, 0, O)</span>
                        <label class="switch">
                            <input type="checkbox" id="exclude-similar">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-item full-width">
                        <span class="toggle-label">Auto-copy to Clipboard</span>
                        <label class="switch">
                            <input type="checkbox" id="auto-copy">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <button id="generate-btn" class="main-btn">
                    <span>Generate Secure Password</span>
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </button>
            </div>

            <div class="history-section" id="history-container">
                <h3>Password History</h3>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>

            <footer class="footer">
                <p>All processing happens locally. No data leaves your browser.</p>
            </footer>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
